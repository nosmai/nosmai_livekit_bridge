group = "com.example.nosmai_livekit_bridge"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.nosmai_livekit_bridge"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Camera2 full support + LiveKit requirement.
        minSdk = 24
    }

    dependencies {
        // org.webrtc.* (VideoFrame, JavaI420Buffer, ...). flutter_webrtc bundles the
        // same WebRTC build at runtime, so this is compileOnly to avoid duplicate classes.
        compileOnly("io.github.webrtc-sdk:android:144.7559.01")

        // com.cloudwebrtc.webrtc.* (FlutterWebRTCPlugin, LocalVideoTrack). Provided at
        // runtime by the flutter_webrtc plugin (pulled in by livekit_client + this
        // package's pub dependency). compileOnly so we don't bundle a second copy.
        compileOnly(project(":flutter_webrtc"))

        // NOTE: the Nosmai SDK is reached purely via reflection (see NosmaiReflection),
        // so there is NO compile-time Nosmai dependency and no AAR is bundled here.
        // The actual classes are loaded at runtime by the nosmai_camera_sdk plugin.
    }
}
